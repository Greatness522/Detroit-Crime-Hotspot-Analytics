name: Refresh Detroit Crime Dashboard

on:
  workflow_dispatch:

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          echo "Repository loaded successfully"
          pwd
          find . -maxdepth 2 -type f | sort