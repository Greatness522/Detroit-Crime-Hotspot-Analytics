name: Refresh Detroit Crime Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # Runs every day at 10 AM UTC

permissions:
  contents: write    

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          echo "Repository loaded successfully"
          pwd
          find . -maxdepth 2 -type f | sort
      - name: Install download dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Download latest 2026 Detroit crime data
        run: |
          python Python/download_2026_data.py

      - name: Verify 2026 dataset
        run: |
          ls -lh Dataset/RMS_Crime_Incidents_2026.csv  
      - name: Install analysis dependencies
        run: |
          pip install numpy pandas matplotlib seaborn folium scikit-learn h3

      - name: Run crime hotspot analysis
        run: |
          python Python/analyze_crime_hotspots.py   
      - name: Publish refreshed dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add Documentation/
          git add Images/ ':!Images/detroit_crime_interactive_dashboard_2024_2026.html'

          COMBINED_DASHBOARD="Images/detroit_crime_interactive_dashboard_2024_2026.html"
          MAX_SIZE=$((95 * 1024 * 1024))

          if [ -f "$COMBINED_DASHBOARD" ]; then
            FILE_SIZE=$(wc -c < "$COMBINED_DASHBOARD" | tr -d ' ')

            if [ "$FILE_SIZE" -le "$MAX_SIZE" ]; then
              echo "Combined dashboard is within publish limit: $FILE_SIZE bytes"
              git add "$COMBINED_DASHBOARD"
            else
              echo "Combined dashboard is too large to publish: $FILE_SIZE bytes"
              echo "Leaving the existing published version unchanged."
            fi
          fi

          if git diff --cached --quiet; then
            echo "No dashboard changes to publish."
          else
            git commit -m "Auto-refresh Detroit crime dashboard"
            git push
          fi       