name: Refresh Detroit Crime Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # Runs every day at 10 AM UTC

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          echo "Repository loaded successfully"
          pwd
          find . -maxdepth 2 -type f | sort
      - name: Install download dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Download latest 2026 Detroit crime data
        run: |
          python Python/download_2026_data.py

      - name: Verify 2026 dataset
        run: |
          ls -lh Dataset/RMS_Crime_Incidents_2026.csv  
      - name: Install analysis dependencies
        run: |
          pip install numpy pandas matplotlib seaborn folium scikit-learn

      - name: Run crime hotspot analysis
        run: |
          python Python/analyze_crime_hotspots.py      